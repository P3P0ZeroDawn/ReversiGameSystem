name: SonarQube Cloud

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master

permissions:
  contents: read

jobs:
  analyze-server:
    name: Analyze server
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: windows-2025

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install .NET SDK
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Restore server projects
        run: >-
          dotnet restore
          tests/ReversiGameSystem.Server.Tests/ReversiGameSystem.Server.Tests.csproj

      - name: Install SonarScanner for .NET
        run: >-
          dotnet tool install --global dotnet-sonarscanner
          --version 11.2.0

      - name: Install .NET coverage tool
        run: >-
          dotnet tool install --global dotnet-coverage
          --version 18.12.0

      - name: Begin SonarQube Cloud analysis
        shell: pwsh
        run: |
          dotnet sonarscanner begin `
            /k:"${{ vars.SONAR_PROJECT_KEY }}" `
            /o:"${{ vars.SONAR_ORGANIZATION }}" `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}" `
            /d:sonar.cs.vscoveragexml.reportsPaths="coverage.xml" `
            /d:sonar.tsql.file.suffixes=".sql,.tsql" `
            /d:sonar.plsql.file.suffixes=".plsql"

      - name: Build server
        run: >-
          dotnet build
          tests/ReversiGameSystem.Server.Tests/ReversiGameSystem.Server.Tests.csproj
          --configuration Release
          --no-restore
          --no-incremental
          -p:TreatWarningsAsErrors=true

      - name: Run isolated server tests with coverage
        shell: pwsh
        run: |
          $testProject = `
            "tests/ReversiGameSystem.Server.Tests/ReversiGameSystem.Server.Tests.csproj"
          $testCommand = `
            "dotnet run --project $testProject --configuration Release --no-build"
          dotnet-coverage collect $testCommand -f coverage -o coverage-isolated.coverage

      - name: Start LocalDB
        shell: pwsh
        run: sqllocaldb start MSSQLLocalDB

      - name: Run database server tests with coverage
        shell: pwsh
        run: |
          $testProject = `
            "tests/ReversiGameSystem.Server.Tests/ReversiGameSystem.Server.Tests.csproj"
          $testCommand = `
            "dotnet run --project $testProject --configuration Release --no-build -- --match-database"
          dotnet-coverage collect $testCommand `
            -f coverage `
            -o coverage-database.coverage

      - name: Merge server coverage
        shell: pwsh
        run: |
          dotnet-coverage merge `
            coverage-isolated.coverage `
            coverage-database.coverage `
            -f xml `
            -o coverage.xml

      - name: End SonarQube Cloud analysis
        shell: pwsh
        run: |
          dotnet sonarscanner end `
            /d:sonar.token="${{ secrets.SONAR_TOKEN }}"
