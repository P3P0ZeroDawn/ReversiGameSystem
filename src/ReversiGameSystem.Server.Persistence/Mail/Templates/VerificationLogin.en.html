<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Reversi: Sign-in verification</title>
</head>
<body style="font-family: Arial, Helvetica, sans-serif; color: #1f2937; line-height: 1.5;">
    <div style="max-width: 520px; margin: 0 auto; padding: 24px; border: 1px solid #e5e7eb; border-radius: 8px;">
        <h2 style="margin-top: 0; color: #111827;">Reversi</h2>
        <p>Your sign-in verification code:</p>
        <p style="font-size: 28px; font-weight: bold; letter-spacing: 4px; color: #111827; margin: 16px 0;">
            {{VerificationCode}}
        </p>
        <p><strong>Expires:</strong> {{ExpiresAtUtc}}</p>
        <p style="color: #4b5563; font-size: 13px;">
            Use it once. Do not share it.
        </p>
    </div>
</body>
</html>
